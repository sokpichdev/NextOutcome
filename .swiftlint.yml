# SwiftLint configuration for NextOutcome.
# Derived from the toolkit baseline in .mobile-agents/.swiftlint.yml; see
# .mobile-agents/standards/coding_standards.md for the rationale behind each rule.
#
# CI (.github/workflows/tests.yml) runs plain `swiftlint lint`, which fails the
# build on `error`-severity violations only. Warnings are surfaced as PR
# annotations and are meant to be burned down over time -- do not add `--strict`
# until the warning count is at zero, or the signal turns into noise everyone
# learns to ignore.
#
# Test sources have their own relaxed overrides in
# NextOutcome/Packages/Tests/.swiftlint.yml (JSON fixtures and spy doubles have a
# legitimately different shape from production code).

disabled_rules:
  - todo                      # TODOs are tracked in the issue tracker, not the linter
  - trailing_whitespace       # handled by the formatter

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - weak_delegate

# Everything Swift that we author. The Xcode project's generated files, SwiftPM's
# build products and the UI test target are deliberately outside this list.
included:
  - NextOutcome/Packages/Sources
  - NextOutcome/Packages/Tests
  - NextOutcome/NextOutcome/App

excluded:
  - NextOutcome/Packages/.build
  - build
  - DerivedData
  - "**/*.generated.swift"

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# The error thresholds sit above the current worst offenders (BTCLiveViewModel:
# 857 lines / 432-line body) so CI is green on the day the linter lands. The
# warning thresholds are deliberately left tight -- those files should shrink,
# and the warning is the reminder. Lower the error thresholds once they have.
file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length: 2
  excluded: [id, x, y, to, vc, ok]

force_cast: error
force_try: error
force_unwrapping: warning
